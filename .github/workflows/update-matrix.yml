name: Update BloodHound Version Matrix

on:
  workflow_dispatch:  # Allow manual trigger
  push:
    branches:
      - main
    paths:
      - 'update_matrix.py'
      - 'requirements.txt'
      - '.github/workflows/update-matrix.yml'

# Deploy phase (requires pages:write and id-token:write)
permissions:
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    name: Update matrix and deploy
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Build phase
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate compatibility matrix
        run: python update_matrix.py

      - name: Prepare deployment directory
        run: |
          mkdir -p _site
          cp index.html _site/
          cp bloodhound_versions.json _site/

      # Deploy phase (requires pages:write and id-token:write)
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
