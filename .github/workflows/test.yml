name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      # Hits Docker Hub for real to catch upstream API changes
      - name: Generate compatibility matrix
        run: python update_matrix.py

      # Published versions don't disappear, so every version in the committed
      # matrix must still be present; a missing one means tags were lost.
      - name: Validate generated matrix
        run: |
          git show HEAD:bloodhound_versions.json > "$RUNNER_TEMP/baseline.json"
          python - <<'EOF'
          import json
          import os

          with open("bloodhound_versions.json") as f:
              versions = json.load(f)["versions"]
          with open(os.path.join(os.environ["RUNNER_TEMP"], "baseline.json")) as f:
              baseline = json.load(f)["versions"]

          assert versions, "matrix is empty"
          for entry in versions:
              assert set(entry) == {"bloodhound", "sharphound", "azurehound"}, entry

          tags = {entry["bloodhound"] for entry in versions}
          missing = sorted({entry["bloodhound"] for entry in baseline} - tags)
          assert not missing, f"versions in committed matrix missing from generated one: {missing}"
          print(f"Matrix OK: {len(versions)} versions (baseline {len(baseline)}), latest {versions[0]['bloodhound']}")
          EOF
